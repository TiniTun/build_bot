[project]
name = "build-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncio>=4.0.0",
    "crawl4ai>=0.8.6",
    "croniter>=6.2.2",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "litellm>=1.83.0",
    "openai>=1.40.0",
    "pydantic>=2.12.5",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "ruff>=0.15.9",
    "typer>=0.24.1",
    "uvicorn[standard]>=0.46.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "core", "provider", "utils"]

[project.scripts]
build-bot = "cli.main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "F401",  # unused imports
]
