# LLM provider configuration, follow https://docs.litellm.ai/docs/providers for your own provider config
llm:
  # `provider` is a free-form label; LiteLLM routes by `model`.
  # Use the LiteLLM model format: https://docs.litellm.ai/docs/providers

  # --- OpenAI-compatible model ---
  provider: openai              # Free-form label (openai, anthropic, minimax, ...)
  model: gpt-4                  # LiteLLM model string
  api_key: sk-your-openai-api-key-here  # WARNING: never commit real keys!
  api_base: null                # Optional custom endpoint (http:// or https://)
  temperature: 0.7
  max_tokens: 2048
  # extra: {}                   # Optional provider-specific params passed to LiteLLM
  # Local LLM request tracing. Writes one redacted JSONL record per request to
  # <logging_path>/llm-traces/YYYY-MM-DD.jsonl so you can inspect model calls
  # without OpenAI Platform logs. API keys are never written.
  # debug:
  #   enabled: true             # default false; turn on local trace logging
  #   include_content: false    # opt-in: also log message/output content (sensitive)

  # --- Anthropic Opus through LiteLLM (alternative) ---
  # provider: anthropic
  # model: anthropic/claude-opus-4.8   # LiteLLM Anthropic model format
  # api_key: sk-ant-your-anthropic-api-key-here
  # temperature: 0.7
  # max_tokens: 4096

default_agent: pickle

# Get your API key at https://brave.com/search/api/
# websearch:
#   provider: brave
#   api_key: your-brave-search-api-key

# Google Places API (New). Nearby recommendation searches request ratings and
# review excerpts, which use the Enterprise + Atmosphere SKU.
# Get a key: https://developers.google.com/maps/documentation/places/web-service
# places:
#   provider: google_places
#   api_key: your-google-places-api-key

